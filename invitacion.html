}

.mision{

align-items:center;

}

button{
background:#00ffff;
border:none;
padding:12px;
margin-top:15px;

button:hover{

}

.star{
position:absolute;
color:#00ffff;

}

@keyframes star{

50%{opacity:1}

}

.coin{

@keyframes coin{

.blink{

@keyframes blink{

}

.loadingbar{
width:100%;
height:12px;
background:#222;
margin-top:15px;
}

.loading{
height:12px;
background:#00ffff;
width:0%;
animation:load 3s linear forwards;
}

@keyframes load{
from{width:0}
to{width:100%}
}

.timer{
margin-top:10px;
color:#00ffaa;
font-size:15px;
}

.big{
font-size:22px;
font-weight:bold;
letter-spacing:2px;
}

.gameover{
margin-top:10px;

font-size:18px;
}

/* sonido arcade que sí funciona */

function beep(){

const ctx=new (window.AudioContext||window.webkitAudioContext)();
const osc=ctx.createOscillator();
const gain=ctx.createGain();

osc.type="square";
osc.frequency.value=650;

osc.connect(gain);
gain.connect(ctx.destination);

osc.start();

gain.gain.exponentialRampToValueAtTime(
0.0001,
ctx.currentTime+0.25
);

}

/* score */

let score=0;

function sumarScore(){

score+=10;

document.getElementById("score").innerText=
score.toString().padStart(6,"0");

}

/* estrellas */

function estrellas(){

const star=document.createElement("div");

star.className="star";

star.innerHTML="✦";

star.style.left=Math.random()*340+"px";

star.style.fontSize=(10+Math.random()*12)+"px";

star.style.opacity=Math.random();

document.getElementById("arcade").appendChild(star);

setTimeout(()=>star.remove(),9000);

}

setInterval(estrellas,1200);

/* monedas */

function moneda(){

const coin=document.createElement("div");

coin.className="coin";

coin.innerHTML="🪙";

coin.style.left=Math.random()*340+"px";

document.getElementById("arcade").appendChild(coin);

sumarScore();

setTimeout(()=>coin.remove(),6000);

}

setInterval(moneda,3000);

/* start */

function startGame(){

beep();

document.getElementById("intro").style.display="none";
document.getElementById("level").style.display="block";

setTimeout(()=>{

document.getElementById("level").style.display="none";
document.getElementById("invite").style.display="block";

},3000);

}

/* contador */

function countdown(){

const fecha=new Date("March 28, 2026 16:00:00").getTime();

setInterval(function(){

const ahora=new Date().getTime();

const diferencia=fecha-ahora;

document.getElementById("timer").innerHTML=

}

/* maps */

function abrirMapa(){

window.open("https://maps.google.com/?q=Av.+Juárez+29,+El+Cerrito,+Cd.+López+Mateos");
